  ko:
    description: 오픈소스 & 자체 호스팅 가능한 Heroku / Netlify / Vercel 대안
    readme: >-
      Coolify는 Heroku / Netlify / Vercel 등의 오픈소스이자 자체 호스팅 가능한 대안입니다.


      자체 하드웨어에서 서버, 애플리케이션 및 데이터베이스를 관리하는 데 도움을 주며, SSH 연결만 있으면 됩니다. VPS, 베어메탈,
      라즈베리파이 등 모든 것을 관리할 수 있습니다.


      <hr>


      자체 서버로 클라우드의 편리함을 누리는 것을 상상해보세요. 그것이 바로 Coolify입니다.


      벤더 종속성이 없어 애플리케이션/데이터베이스 등의 모든 구성이 서버에 저장됩니다. 따라서 Coolify 사용을 중단하기로
      결정하더라도(오 안돼) 실행 중인 리소스를 계속 관리할 수 있습니다. 자동화와 모든 마법을 잃게 되지만요. 🪄️


      ### 기능


      **모든 언어:**

      Coolify는 광범위한 프로그래밍 언어와 프레임워크와 호환되어 정적 웹사이트, API, 백엔드, 데이터베이스, 서비스 및 기타
      유형의 애플리케이션을 실행할 수 있습니다.


      **모든 서버:**

      자체 서버, VPS, 라즈베리파이, EC2, DigitalOcean, Linode, Hetzner 등 모든 서버에 리소스를 배포할 수
      있습니다. SSH 연결만 있으면 됩니다.


      **모든 사용 사례:**

      요구사항에 따라 단일 서버, 다중 서버 또는 Docker Swarm 클러스터에 리소스를 배포할 수 있습니다. (쿠버네티스 지원
      예정!)


      **모든 서비스:**

      Docker와 호환되는 모든 서비스를 배포할 수 있습니다. 또한 원클릭으로 배포 가능한 많은 서비스들이 있습니다.

      전체 목록은 여기서 확인하세요.


      **푸시 투 디플로이:**

      요즘은 Git 통합이 일반적입니다. GitHub, GitLab, Bitbucket, Gitea 등 호스팅 및 자체 호스팅 플랫폼과의
      통합을 제공합니다.


      **무료 SSL 인증서:**

      Coolify는 사용자 정의 도메인에 대한 Let's Encrypt SSL 인증서를 자동으로 설정하고 갱신하므로 신경 쓸 필요가
      없습니다.


      **벤더 종속성 없음:**

      데이터를 완전히 제어할 수 있습니다. 모든 설정이 자체 서버에 저장되어 Coolify 사용을 중단하더라도(오 안돼) 모든 것을 관리할
      수 있습니다.


      **자동 DB 백업:**

      데이터가 S3 호환 솔루션에 자동으로 백업되어 문제 발생 시 몇 번의 클릭으로 쉽게 복원할 수 있습니다.


      **웹훅:**

      Github Actions,
  ja:
    description: オープンソースで自己ホスト可能なHeroku / Netlify / Vercelの代替サービス。
    readme: |-
      Coolify は、Heroku / Netlify / Vercel などのオープンソースで自己ホスト可能な代替サービスです。

      サーバー、アプリケーション、データベースを自身のハードウェアで管理することができ、SSHコネクションのみが必要です。VPS、ベアメタル、Raspberry Pi、その他のあらゆるものを管理できます。

      <hr>

      クラウドの利便性を自身のサーバーで実現することができます。それがCoolifyです。

      ベンダーロックインがないため、アプリケーション/データベース等の全ての設定はサーバーに保存されます。そのため、Coolifyの使用を中止しても（まさか！）、実行中のリソースを管理し続けることができます。自動化と魔法のような機能は失われますが。🪄️

      ### 機能

      **あらゆる言語：**
      Coolifyは幅広いプログラミング言語とフレームワークに対応しており、静的ウェブサイト、API、バックエンド、データベース、サービス、その他のアプリケーションを展開できます。

      **あらゆるサーバー：**
      自身のサーバー、VPS、Raspberry Pi、EC2、DigitalOcean、Linode、Hetznerなど、あらゆるサーバーにリソースをデプロイできます。必要なのはSSH接続だけです。

      **あらゆるユースケース：**
      要件に応じて、単一サーバー、複数サーバー、Docker Swarmクラスターにリソースをデプロイできます。（Kubernetes対応は開発中！）

      **あらゆるサービス：**
      Dockerと互換性のあるあらゆるサービスをデプロイできます。また、ワンクリックでデプロイ可能な多くのサービスも利用できます。
      詳細なリストはこちらをご覧ください。

      **プッシュでデプロイ：**
      現在、Git統合は標準となっています。GitHub、GitLab、Bitbucket、Giteaなどのホスト型および自己ホスト型プラットフォームとの統合を提供します。

      **無料のSSL証明書：**
      CoolifyがカスタムドメインのためのLet's Encrypt SSL証明書の設定と更新を自動的に処理するため、手間がかかりません。

      **ベンダーロックインなし：**
      データを完全にコントロールできます。全ての設定は自身のサーバーに保存されるため、Coolifyの使用を中止しても（まさか！）すべてを管理できます。

      **自動データベースバックアップ：**
      データはS3互換のソリューションに自動的にバックアップされ、問題が発生した場合も数クリックで簡単に復元できます。

      **Webhook：**
      Github Actions、Gitlab CI、Bitbucket Pipelines、その他のCI/CDツールを使用して、CI/CDパイプラインに統合したりカスタム統合を作成したりできます。

      **パワフルなAPI：**
      Coolifyは堅牢なAPIを提供し、デプロイメントの自動化、リソース管理、既存ツールとの統合を可能にし、無限の可能性を提供します。

      **リアルタイムターミナル：**
      サーバーを管理するためにブラウザを離れる必要はありません。Coolifyのリアルタイムターミナルで、
