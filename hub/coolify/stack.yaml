    readme: >-
      كوليفاي هو بديل مفتوح المصدر وقابل للاستضافة الذاتية لـ Heroku / Netlify /
      Vercel وغيرها.


      يساعدك في إدارة خوادمك وتطبيقاتك وقواعد بياناتك على أجهزتك الخاصة؛ كل ما
      تحتاجه هو اتصال SSH. يمكنك إدارة VPS والأجهزة المادية وأجهزة Raspberry Pi
      وغيرها.


      <hr>


      تخيل أن تحصل على سهولة السحابة ولكن مع خوادمك الخاصة. هذا هو كوليفاي.


      لا يوجد قيود من المزود، مما يعني أن جميع إعدادات تطبيقاتك/قواعد
      بياناتك/إلخ يتم حفظها على خادمك. لذا، إذا قررت التوقف عن استخدام كوليفاي
      (يا لا!)، فلا يزال بإمكانك إدارة مواردك التشغيلية. ستفقد الأتمتة وكل
      السحر. 🪄️


      ### المميزات


      **أي لغة:**

      كوليفاي متوافق مع مجموعة واسعة من لغات البرمجة والأطر، مما يتيح لك إطلاق
      مواقع ويب ثابتة وواجهات برمجة التطبيقات والخلفيات وقواعد البيانات والخدمات
      وأنواع أخرى من التطبيقات.


      **أي خادم:**

      يمكنك نشر مواردك على أي خادم، بما في ذلك خوادمك الخاصة وVPS وRaspberry Pi
      وEC2 وDigitalOcean وLinode وHetzner وغيرها. كل ما تحتاجه هو اتصال SSH.


      **أي حالة استخدام:**

      يمكنك نشر مواردك على خادم واحد أو عدة خوادم أو مجموعات Docker Swarm وفقًا
      لمتطلباتك. (دعم Kubernetes قادم!)


      **أي خدمة:**

      يمكنك نشر أي خدمة تريدها متوافقة مع Docker. كما تتوفر العديد من الخدمات
      سهلة التثبيت بنقرة واحدة.

      شاهد القائمة الكاملة هنا.


      **النشر بالدفع:**

      في الوقت الحاضر، يعتبر تكامل Git معيارًا. نوفر تكاملاً مع المنصات
      المستضافة والذاتية الاستضافة مثل GitHub وGitLab وBitbucket وGitea وغيرها.


      **شهادات SSL مجانية:**

      يتولى كوليفاي إعداد وتجديد شهادات SSL من Let's Encrypt لنطاقاتك المخصصة
      تلقائيًا، لذا يمكنك الاسترخاء وعدم التعامل معها.


      **لا قيود من المزود:**

      لديك تحكم كامل في بياناتك. يتم حفظ جميع الإعدادات على خوادمك الخاصة، مما
      يمنحك القدرة على الإشراف على كل شيء حتى إذا قررت التوق
