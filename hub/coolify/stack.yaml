      server, VPS, Raspberry Pi, EC2, DigitalOcean, Linode, Hetzner e altri.
      Tutto ciò di cui hai bisogno è una connessione SSH.


      **Qualsiasi Caso d'Uso:**

      Puoi distribuire le tue risorse su un singolo server, più server o cluster
      Docker Swarm in base alle tue esigenze. (Il supporto per Kubernetes è in
      arrivo!)


      **Qualsiasi Servizio:**

      Puoi distribuire qualsiasi servizio compatibile con Docker. Inoltre, sono
      disponibili molti servizi one-click da distribuire.

      Vedi la lista completa qui.


      **Push to deploy:**

      Al giorno d'oggi, l'integrazione Git è considerata la norma. Forniamo
      integrazione sia con piattaforme hosted che self-hosted come GitHub,
      GitLab, Bitbucket, Gitea e altri.


      **Certificati SSL Gratuiti:**

      Coolify si occupa automaticamente di configurare e rinnovare i certificati
      SSL Let's Encrypt per i tuoi domini personalizzati, così puoi rilassarti e
      non doverne occuparti.


      **Nessun vendor lock-in:**

      Hai il controllo completo dei tuoi dati. Tutte le impostazioni sono
      salvate sui tuoi server, dandoti la possibilità di supervisionare tutto
      anche se decidi di smettere di usare Coolify (oh nooo).


      **Backup Automatici DB:**

      I tuoi dati vengono automaticamente salvati su qualsiasi soluzione
      compatibile con S3, permettendoti di ripristinarli facilmente con pochi
      clic in caso di problemi.


      **Webhook:**

      Integra nei tuoi pipeline CI/CD o crea integrazioni personalizzate usando
      Github Actions, Gitlab CI, Bitbucket Pipelines o qualsiasi altro strumento
      CI/CD di tua scelta.


      **API Potente:**

      Coolify offre un'API robusta che ti permette di automatizzare le
      distribuzioni, gestire le risorse e integrare con i tuoi strumenti
      attuali, offrendo possibilità illimitate.


      **Terminale in Tempo Reale:**

      Non devi lasciare il tuo browser per gestire i tuoi server. Il terminale
      in tempo reale di Coolify ti permette di eseguire comandi sui tuoi server
      direttamente dal browser.


      **Collaborativo:**

      Condividi i tuoi progetti con i membri del tuo team e lavorate insieme su
      di essi. Puoi anche controllare permessi e ruoli per ogni membro.


      **Distribuzioni Pull Request:**

      Distribuisci automaticamente nuovi commit e pull request separatamente per
      rivedere rapidamente i contributi e velocizzare il lavoro di squadra!


      **Automazioni Server:**

      Una volta che il tuo server è connesso, Coolify gestirà numerose attività
      automaticamente, permettendoti di concentrarti sul tuo codice.


