      ### Caractéristiques

      Mage est un framework hybride pour transformer et intégrer des données. Il combine le meilleur des deux mondes : la flexibilité des notebooks avec la rigueur du code modulaire.

      - **Extraire** et synchroniser des données à partir de sources tierces.
      - **Transformer** les données avec des pipelines en temps réel et par lots en utilisant Python, SQL et R.
      - **Charger** des données dans votre entrepôt de données ou votre lac de données en utilisant nos connecteurs pré-construits.
      - **Exécutez**, surveillez et orchestrez des milliers de pipelines sans perdre le sommeil.

  de:
