services:
  traefik:
    image: traefik:v${TRAEFIK_VERSION:-3.6}
    command:
      - --providers.docker=true
      - --entrypoints.https.address=:443
      - --entrypoints.https.http.tls=true
    ports:
      - ${HTTP_PORT:-80}:80
      - ${HTTPS_PORT:-443}:443
      # - 8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # - ./config:/etc/traefik:ro
      # No certificate is shipped with this stack: a shipped private key is a
      # published private key. The Stack app mints one per install and points
      # STACK_CERTS_DIR at it; standalone, run ./scripts/gen-cert.sh once to
      # fill ./certs. Long syntax because the app's path contains spaces.
      - type: bind
        source: ${STACK_CERTS_DIR:-./certs}
        target: /certs
        read_only: true
    environment:
      # Not read by traefik. It changes whenever the leaf is rotated, which
      # makes `docker compose up` recreate this container so the new
      # certificate is actually loaded — traefik only watches its config file,
      # not the certificate files it references.
      STACK_CERT_FINGERPRINT: ${STACK_CERT_FINGERPRINT:-}
    configs:
      - source: traefik_conf
        target: /etc/traefik/traefik.yml
      - source: traefik_fileconf
        target: /etc/traefik/fileConfig.yml
    stop_grace_period: 0s
    labels:
      dash.name: Reverse proxy
      dash.icon: traefikproxy
      dash.desc: HTTP reverse proxy
      dash.url: https://traefik.$DOMAIN/dashboard/#/http/routers
      traefik.http.routers.traefik.rule: Host(`traefik.$DOMAIN`)
      traefik.http.services.traefik.loadbalancer.server.port: 8080
