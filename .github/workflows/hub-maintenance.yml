name: Hub maintenance

# Keeps the catalogue's information about each app true over time.
#
# The catalogue makes factual claims — this project has 63k stars, is MIT, lives
# at this URL, ships version X released on that date. Those claims rot silently:
# nothing in the repo changes when a project relicenses, gets renamed, or cuts a
# release. This workflow is what keeps them honest.
#
# It is split in two jobs on purpose, because the two halves have very different
# risk profiles:
#
#   metadata — stars/homepage/repository/license/updated_at. Descriptive only:
#              wrong values mislead, but nothing a user runs changes. Safe to
#              apply automatically; lands as one mechanical PR.
#
#   versions — detection only, never an edit. Bumping a version changes the
#              image a user executes, which no API can validate. Each bump is
#              filed as a work order for the upgrade task, which applies it and
#              must prove it still works with test-stack.sh before merging.

on:
  schedule:
    # Daily, off-peak and off the hour (the scheduler's busiest minute is :00).
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Restrict to one app slug (blank = all)"
        required: false
        type: string

concurrency:
  group: hub-maintenance
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  BRANCH: chore/hub-metadata

jobs:
  metadata:
    name: Refresh descriptive metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Cached upstream responses make a re-run (or a retried job) cheap and
      # consistent; a day-old entry is refetched, so the data is never stale.
      - uses: actions/cache@v4
        with:
          path: .cache/upstream
          key: upstream-${{ github.run_id }}
          restore-keys: upstream-

      - name: Sync metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # work/ is gitignored, so it does not exist in a fresh checkout. `tee`
          # opens its output file before the script runs (and before the script
          # mkdir's the directory itself): without this it errors, still passes
          # stdout through, and exits 1 — failing the step under `pipefail` with
          # a log that otherwise looks like a clean run.
          mkdir -p work
          node packages/scripts/maintenance/sync-metadata.ts \
            ${{ inputs.only && format('--only {0}', inputs.only) || '' }} \
            --json work/metadata-sync.json | tee work/metadata-sync.txt

      - name: Open or update the metadata PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain hub)" ]; then
            echo "catalogue metadata already matches upstream"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A single long-lived branch, rewritten each run: the PR always shows
          # the diff against today's upstream instead of accumulating a chain of
          # superseded star counts.
          git checkout -B "$BRANCH"
          git add hub
          git commit -m ":arrow_up: Refresh hub metadata

          $(sed -n '/stacks updated/p' work/metadata-sync.txt)

          Generated by .github/workflows/hub-maintenance.yml"
          git push --force origin "$BRANCH"

          body=$(printf 'Mechanical refresh of the descriptive fields (stars, homepage, repository, license, updated_at) from the upstream APIs.\n\nVersions are **not** touched here — those go through the upgrade task, which runs the non-regression suite first.\n\n```\n%s\n```\n' "$(cat work/metadata-sync.txt)")

          # `--label` fails outright on a label that does not exist, which would
          # break the first run on a fresh repository.
          gh label create maintenance --color 0366d6 \
            --description "Automated catalogue upkeep" 2>/dev/null || true

          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --body "$body"
          else
            gh pr create --head "$BRANCH" --base main \
              --title "⬆️ Refresh hub metadata" --body "$body" --label maintenance
          fi

  versions:
    name: Detect version drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: actions/cache@v4
        with:
          path: .cache/upstream
          key: upstream-versions-${{ github.run_id }}
          restore-keys: upstream-

      - name: Check versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # See the metadata job: `tee` cannot create work/ for itself.
          mkdir -p work
          node packages/scripts/maintenance/check-versions.ts \
            ${{ inputs.only && format('--only {0}', inputs.only) || '' }} \
            --json work/version-drift.json --markdown | tee work/version-drift.md

      - uses: actions/upload-artifact@v4
        with:
          name: version-drift
          path: |
            work/version-drift.json
            work/version-drift.md

      # One always-current summary issue, plus a trickle of individual work
      # orders. The trickle is deliberate: the upgrade task has to boot each app
      # to validate it, so opening 150 issues at once would create a backlog
      # nobody can work through, and the noise would bury the urgent ones.
      - name: File upgrade work orders
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_NEW_ISSUES: "3"
          MAX_OPEN_ISSUES: "10"
        run: node packages/scripts/maintenance/file-upgrades.ts work/version-drift.json
